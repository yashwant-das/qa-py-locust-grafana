name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Offline quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "**/requirements*.txt"
      - name: Install developer dependencies
        run: |
          uv venv --python 3.13
          uv pip sync requirements-dev.txt
      - name: Check Python and dependency consistency
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy target-app locustfiles
          uv pip check
      - name: Run unit tests
        run: uv run --no-sync pytest -q
      - name: Check all maintained files
        run: uv run --no-sync pre-commit run --all-files

  resolve-lock:
    name: Resolve dependency lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          python-version: "3.13"
      - name: Resolve and export dependencies
        run: |
          uv lock
          uv export --locked --no-dev --no-emit-project -o target-app/requirements.txt
          uv export --locked --all-groups --no-emit-project -o requirements-dev.txt
          python - <<'PYTHON'
          import base64
          import gzip
          import json
          from pathlib import Path
          files = {name: Path(name).read_text() for name in ["uv.lock", "target-app/requirements.txt", "requirements-dev.txt"]}
          bundle = base64.b64encode(gzip.compress(json.dumps(files).encode())).decode()
          for index in range(0, len(bundle), 1000):
              print("LOCK_BUNDLE_PART:" + bundle[index:index + 1000])
          PYTHON
