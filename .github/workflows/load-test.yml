name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Offline quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install developer dependencies
        run: uv sync --locked
      - name: Check Python and dependency consistency
        run: |
          uv run --locked --no-sync ruff check .
          uv run --locked --no-sync ruff format --check .
          uv run --locked --no-sync mypy target-app locustfiles
          uv pip check
          bash scripts/check-exports.sh
      - name: Run unit tests
        run: uv run --locked --no-sync pytest -q
      - name: Check all maintained files
        run: uv run --locked --no-sync pre-commit run --all-files

  diagrams:
    name: Documentation diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Extract current diagrams
        run: |
          mkdir -p /tmp/locust-diagrams
          python3 - <<'PYTHON'
          import json
          import re
          from pathlib import Path
          output = Path("/tmp/locust-diagrams")
          for source in [Path("README.md"), *sorted(Path("docs").glob("*.md"))]:
              for index, code in enumerate(re.findall(r"```mermaid\n(.*?)\n```", source.read_text(), re.S)):
                  (output / f"{source.stem}-{index}.mmd").write_text(code)
          config = {"executablePath": "/usr/bin/google-chrome", "args": ["--no-sandbox"]}
          (output / "puppeteer.json").write_text(json.dumps(config))
          PYTHON
      - name: Render Mermaid diagrams
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          for source in /tmp/locust-diagrams/*.mmd; do
            npx --yes --package=@mermaid-js/mermaid-cli@12.0.0 --package=puppeteer@25.10.0 \
              mmdc -i "$source" -o "$source.png" -p /tmp/locust-diagrams/puppeteer.json --size 1600
          done
      - name: Upload diagram previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-diagrams
          path: /tmp/locust-diagrams/*.png
          retention-days: 1
