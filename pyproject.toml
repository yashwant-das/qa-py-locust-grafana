[project]
name = "qa-py-locust-grafana"
version = "0.1.0"
description = "Compare client and server latency with Locust, Prometheus and Grafana"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "flask==3.1.3",
    "gunicorn==26.2.0",
    "prometheus-client==0.26.0",
]

[dependency-groups]
load-test = ["locust==2.46.7", "pytest==9.1.1"]
dev = [
    {include-group = "load-test"},
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "ruff==0.17.1",
]

[tool.uv]
package = false
required-version = "==0.13.6"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["docs/superpowers", ".superpowers"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = ["target-app", "locustfiles"]
mypy_path = "target-app:locustfiles"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
